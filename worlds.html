<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; media-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worlds — Sercle</title>
<link rel="icon" href="assets/brand/sercle-favicon-official.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/public.css">
<script src="assets/js/worlds-data.js"></script>
<script src="assets/js/components.js"></script>
</head>
<body class="theme-cinematic">
<div id="chrome-top" data-current="worlds"></div>
<script src="assets/js/chrome-boot.js"></script>
<main id="main" tabindex="-1">
  <div class="page-head">
    <p class="eyebrow">World directory</p>
    <h1>Eleven worlds.<br>Distinct presences.</h1>
    <p class="intro">Every world is shown at its current public stage. Open a card for a local preview; only live worlds are open to the public today.</p>
    <div class="filters" role="group" aria-label="Filter worlds">
      <div class="filter-group" id="status-filters"><button class="chip" type="button" data-k="all" aria-pressed="true">All <span class="count">11</span></button><button class="chip" type="button" data-k="live" aria-pressed="false">Live <span class="count">2</span></button><button class="chip" type="button" data-k="soon" aria-pressed="false">Coming soon <span class="count">1</span></button><button class="chip" type="button" data-k="dev" aria-pressed="false">In development <span class="count">6</span></button><button class="chip" type="button" data-k="future" aria-pressed="false">Future <span class="count">2</span></button></div>
      <div class="search"><label for="q">Find</label><input id="q" type="search" placeholder="World name" autocomplete="off" spellcheck="false"></div>
    </div>
    <p class="result-line" id="result-line" role="status" aria-live="polite">11 worlds shown</p>
  </div>
  <div class="section flush-top">
    <ul class="dir-grid" id="dir-grid"></ul>
    <noscript><p class="noscript-note">This page builds the World list with JavaScript. The eleven Worlds are Aeon, Atmos, Narrative, Cast, Audio, Forge, Lens, Render, Stage, Cinema and Loop.</p></noscript>
    <div class="empty-state" id="empty" hidden><p><strong>No worlds match.</strong></p><p>Try another name or choose “All”.</p><button class="btn btn-ghost" type="button" id="reset">Show all worlds</button></div>
  </div>
</main>
<script src="assets/js/pages/worlds.js"></script>
<div id="chrome-footer"></div>
<script src="assets/js/chrome-boot.js"></script>
</body>
</html>
